services:
  # Full-Stack Web Platform (React Frontend + Express API + Static Serving)
  - type: web
    name: nexus-platform
    env: node
    plan: free
    region: oregon
    buildCommand: node scripts/render-build.js
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false

# Free Managed PostgreSQL Database
databases:
  - name: nexus-db
    plan: free
    region: oregon
    databaseName: nexus_db
    user: nexus_user
